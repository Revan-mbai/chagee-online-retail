<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chagee Singapore · Online retail improvements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
{{THEME}}
</style>
</head>
<body>
<div id="stage"><div id="deck">
{{SLIDES}}
</div></div>

<div id="toolbar" role="toolbar" aria-label="Slide controls">
  <button id="prev" aria-label="Previous step" title="Previous step (←)">◀</button><span class="count" id="count"><input id="goto" type="text" inputmode="numeric" aria-label="Go to slide number" title="Type a slide number and press Enter (G)"><span class="tot"></span></span>
  <button id="next" aria-label="Next step" title="Next step: darken the next right-hand card, then the next slide (→ or Space)">▶</button><span class="sep"></span>
  <button id="notesb" title="Speaker notes (N)">Notes</button>
  <span class="sep"></span><button id="printb" title="Print or save as PDF, one slide per page (P)">⎙ Print / PDF</button>
  <button id="fs" aria-label="Full screen" title="Full screen (F)">⛶ Full screen</button>
</div>
<div id="toast" role="status"></div>
<div id="notes"><h6>Speaker notes</h6><div class="nb"></div></div>
<script>
{{DECKJS}}
</script>
</body>
</html>
